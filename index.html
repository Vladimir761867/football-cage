<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1f27">
<title>Дворовый футбол</title>
<meta name="description" content="Дворовый футбол — мобильная игра: Квадрат, Американка 300 и Навес. Косметика не влияет на игру.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261112-19">
</head>
<body>
<div id="app">

  <!-- ГЛАВНЫЙ ЭКРАН -->
  <section class="screen" id="screen-home">
    <canvas class="bg-canvas" id="home-bg"></canvas>
    <div class="screen-inner home-inner">
      <div class="home-top">
        <div class="coins-chip" id="home-coins">🪙 <b>0</b></div>
        <button class="icon-btn" id="btn-settings" title="Настройки">⚙</button>
      </div>
      <h1 class="logo">Дворовый<br>футбол<span class="logo-ball">⚽</span></h1>
      <div class="home-yard-label" id="home-yard-label">Классический двор</div>
      <div class="home-actions">
        <button class="btn btn-primary btn-big" id="btn-play">▶ Играть</button>
        <button class="btn btn-green daily-button" id="btn-daily"><span>Вызов дня</span><small id="home-daily-label"></small></button>
        <div class="home-row">
          <button class="btn btn-paper" id="btn-shop">🛒 Магазин</button>
          <button class="btn btn-paper" id="btn-yards">🏠 Мой двор</button>
        </div>
        <div class="home-row">
          <button class="btn btn-paper" id="btn-wardrobe">👕 Одежда</button>
          <button class="btn btn-paper" id="btn-online">С друзьями</button>
        </div>
      </div>
      <div class="fair-note">🧢 Косметика — только стиль. На игру не влияет.</div>
    </div>
  </section>

  <!-- ВЫБОР РЕЖИМА -->
  <section class="screen hidden" id="screen-modes">
    <canvas class="bg-canvas" id="modes-bg"></canvas>
    <div class="screen-inner">
      <div class="top-bar">
        <button class="icon-btn" data-nav="home">←</button>
        <div class="paper-title">Играть</div>
        <div class="coins-chip coins-small" id="modes-coins">🪙 <b>0</b></div>
      </div>
      <div class="difficulty-picker">
        <span>Сложность</span>
        <button class="difficulty-btn" data-difficulty="beginner" aria-label="Уровень 1: Знакомство">1</button>
        <button class="difficulty-btn" data-difficulty="easy" aria-label="Уровень 2: Разминка">2</button>
        <button class="difficulty-btn active" data-difficulty="normal" aria-label="Уровень 3: Двор">3</button>
        <button class="difficulty-btn" data-difficulty="hard" aria-label="Уровень 4: Мастер">4</button>
        <button class="difficulty-btn" data-difficulty="expert" aria-label="Уровень 5: Легенда">5</button>
      </div>
      <p class="difficulty-detail" id="difficulty-detail"></p>
      <div class="cup-panel">
        <strong>🏆 Кубки двора</strong><span>3 этапа · против ботов · прогресс сохраняется</span>
        <div class="cup-actions">
          <button class="btn btn-paper" data-cup="square">Кубок квадрата</button>
          <button class="btn btn-paper" data-cup="am300">Кубок американки</button>
        </div>
        <button class="btn btn-green hidden" id="continue-cup"></button>
        <span id="cup-medals"></span>
      </div>
      <div class="opponents-picker">
        <span>Американка: соперники</span>
        <button class="opponents-btn active" data-opponents="1">1</button>
        <button class="opponents-btn" data-opponents="2">2</button>
        <button class="opponents-btn" data-opponents="3">3</button>
        <button class="opponents-btn" data-opponents="0">Тренировка</button>
      </div>
      <div class="mode-cards">
        <button class="mode-card" data-mode="dog">
          <div class="mode-card-name">Собачка</div>
          <div class="mode-card-desc">Быстрые пасы под прессингом, 4×1 или 5×2.</div>
          <div class="mode-card-best" id="best-dog"></div>
        </button>
        <button class="mode-card" data-mode="square">
          <div class="mode-card-name">Квадрат</div>
          <div class="mode-card-desc">Отбей до второго отскока. На 10 штрафах — вылет.</div>
          <div class="mode-card-best" id="best-square"></div>
        </button>
        <button class="mode-card" data-mode="am300">
          <div class="mode-card-name">Американка 300</div>
          <div class="mode-card-desc">Попадай в раму и углы. Цель — 300 очков.</div>
          <div class="mode-card-best" id="best-am300"></div>
        </button>
        <button class="mode-card" data-mode="cross">
          <div class="mode-card-name">Навес</div>
          <div class="mode-card-desc">Разыграй навес и забей. Промах — в ворота.</div>
          <div class="mode-card-best" id="best-cross"></div>
        </button>
      </div>
      <div class="mode-extras">
        <button class="btn btn-paper" id="btn-activities">Испытания</button>
        <button class="btn btn-paper" id="btn-fast-duel">Быстрая дуэль</button>
        <button class="btn btn-paper" id="btn-dog-roles">Смена водящего</button>
      </div>
    </div>
  </section>

  <!-- МАТЧ -->
  <section class="screen hidden" id="screen-match">
    <canvas id="match-canvas"></canvas>
    <div class="match-hud">
      <div class="match-hud-top">
        <button class="icon-btn" id="btn-pause">⏸</button>
        <div class="paper-title paper-title-sm" id="match-title">Квадрат</div>
        <div class="hud-timer" id="match-timer"></div>
      </div>
      <div class="hud-score-row" id="match-score-row"></div>
    </div>
    <div class="match-hint" id="match-hint"></div>
    <div class="match-choices hidden" id="match-choices"></div>
    <button class="btn btn-paper lesson-skip hidden" id="btn-skip-lesson">Пропустить обучение</button>
    <div class="match-toast" id="match-toast"></div>
  </section>

  <!-- ИТОГ МАТЧА -->
  <section class="screen hidden" id="screen-result">
    <canvas class="bg-canvas" id="result-bg"></canvas>
    <div class="screen-inner result-inner">
      <div class="paper-title result-title" id="result-title">Матч окончен</div>
      <div class="result-card">
        <div class="result-score" id="result-score">0 : 0</div>
        <div class="result-sub" id="result-sub"></div>
        <div class="result-best" id="result-moment"></div>
        <div class="result-reward" id="result-reward"></div>
      </div>
      <button class="btn btn-primary btn-big" id="btn-rematch">🔁 Ещё раз</button>
      <div class="result-actions">
        <button class="btn btn-green hidden" id="btn-share-result">Вызвать друга</button>
        <button class="btn btn-paper hidden" id="btn-replay">Повтор момента</button>
      </div>
      <button class="btn btn-paper btn-exit" id="btn-result-menu">В меню</button>
    </div>
  </section>

  <!-- МАГАЗИН -->
  <section class="screen hidden" id="screen-shop">
    <canvas class="bg-canvas" id="shop-bg"></canvas>
    <div class="screen-inner">
      <div class="top-bar">
        <button class="icon-btn" data-nav="home">←</button>
        <div class="paper-title">Магазин</div>
        <div class="coins-chip coins-small" id="shop-coins">🪙 <b>0</b></div>
      </div>
      <div class="shop-tabs">
        <button class="shop-tab active" data-tab="yards">🏠 Дворы</button>
        <button class="shop-tab" data-tab="balls">⚽ Мячи</button>
        <button class="shop-tab" data-tab="outfits">👕 Одежда</button>
      </div>
      <div class="yard-country-filter" id="yard-country-filter" aria-label="Страна двора">
        <button class="yard-era-btn active" data-country="Россия" aria-pressed="true">Россия</button>
        <button class="yard-era-btn" data-country="Испания" aria-pressed="false">Испания</button>
      </div>
      <div class="yard-country-filter" id="yard-season-filter" aria-label="Сезон двора">
        <button class="yard-era-btn active" data-season="summer" aria-pressed="true">Лето</button>
        <button class="yard-era-btn" data-season="winter" aria-pressed="false">Зима</button>
      </div>
      <div class="yard-era-filter" id="yard-era-filter">
        <button class="yard-era-btn active" data-era="all">Все</button>
        <button class="yard-era-btn" data-era="80-е">80-е</button>
        <button class="yard-era-btn" data-era="90-е">90-е</button>
        <button class="yard-era-btn" data-era="2000-е">2000-е</button>
        <button class="yard-era-btn" data-era="2010-е">2010-е</button>
        <button class="yard-era-btn" data-era="2020-е">2020-е</button>
      </div>
      <div class="yard-era-filter hidden" id="outfit-era-filter" aria-label="Десятилетие одежды">
        <button class="outfit-era-btn" data-outfit-era="80">80-е</button>
        <button class="outfit-era-btn" data-outfit-era="90">90-е</button>
        <button class="outfit-era-btn" data-outfit-era="00">2000-е</button>
        <button class="outfit-era-btn" data-outfit-era="10">2010-е</button>
        <button class="outfit-era-btn" data-outfit-era="20">2020-е</button>
      </div>
      <div class="shop-list" id="shop-list"></div>
      <div class="fair-note">Все предметы — косметика. Физика мяча и правила одинаковы для всех.</div>
    </div>
  </section>

  <!-- МОДАЛКИ -->
  <div class="modal-wrap hidden" id="modal-wrap">
    <div class="modal" id="modal-box"></div>
  </div>

</div>
<script src="js/sound.js?v=20261112-16"></script>
<script src="js/save.js?v=20261112-19"></script>
<script src="js/wardrobe.js?v=20261112-16"></script>
<script src="js/competition.js?v=20261112-16"></script>
<script src="js/activity.js?v=20261112-19"></script>
<script src="js/shot-rules.js?v=20261112-16"></script>
<script src="js/room-rules.js?v=20261112-16"></script>
<script src="js/yards.js?v=20261112-19"></script>
<script src="js/gesture.js?v=20261112-16"></script>
<script src="js/mode_dog.js?v=20261112-19"></script>
<script src="js/mode_square.js?v=20261112-19"></script>
<script src="js/mode_am300.js?v=20261112-19"></script>
<script src="js/mode_cross.js?v=20261112-19"></script>
<script src="js/online.js?v=20261112-16"></script>
<script src="js/main.js?v=20261112-19"></script>
</body>
</html>
